<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FCN Devis Vitres</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>FCN Devis Vitres</h1>
      <p>Estimez le coût de remplacement ou pose de vitrage</p>
    </header>

    <div class="form-card">
      <form id="devis-form" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label for="largeur">Largeur (cm)</label>
            <input type="number" id="largeur" min="1" max="500" placeholder="ex : 120" required />
          </div>
          <div class="form-group">
            <label for="hauteur">Hauteur (cm)</label>
            <input type="number" id="hauteur" min="1" max="300" placeholder="ex : 90" required />
          </div>
        </div>

        <div class="form-group">
          <label for="type-vitrage">Type de vitrage</label>
          <select id="type-vitrage" required>
            <option value="simple">Simple vitrage (30 €/m²)</option>
            <option value="double" selected>Double vitrage (80 €/m²)</option>
            <option value="triple">Triple vitrage (120 €/m²)</option>
            <option value="feuillete">Vitrage feuilleté (100 €/m²)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="nombre-vitrages">Nombre de vitres</label>
          <input type="number" id="nombre-vitrages" min="1" max="50" value="1" />
        </div>

        <button type="submit" class="btn-calculer">Calculer le devis</button>
      </form>
    </div>

    <div id="resultat"></div>
  </div>

  <script src="js/calcul-prix.js"></script>
  <script src="js/devis-form.js"></script>
</body>
</html>
